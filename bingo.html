<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Play Karaoke Bingo at your next karaoke night! A fun interactive game from the Austin Karaoke Directory.">
    <meta property="og:title" content="Karaoke Bingo - Austin Karaoke Directory">
    <meta property="og:description" content="Play Karaoke Bingo at your next karaoke night! A fun interactive game from the Austin Karaoke Directory.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://karaokedirectory.com/bingo.html">
    <meta property="og:image" content="https://karaokedirectory.com/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Greater Austin Karaoke Directory - find karaoke nights by day, venue, and neighborhood">
    <meta name="twitter:image" content="https://karaokedirectory.com/og.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Karaoke Bingo - Austin Karaoke Directory">
    <meta name="twitter:description" content="Play Karaoke Bingo at your next karaoke night! A fun interactive game from the Austin Karaoke Directory.">
    <link rel="canonical" href="https://karaokedirectory.com/bingo.html">
    <title>Karaoke Bingo - Austin Karaoke Directory</title>

    <!-- Favicons. SVG first: modern browsers prefer it and it stays crisp at
         any size. .ico carries 16/32/48 rasters for browsers that ignore SVG. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#12203a">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Application styles -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/bingo.css">
</head>
<body>
    <div data-site-header></div>

    <nav class="navigation-container">
        <div class="navigation">
            <a href="index.html" class="nav-btn">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Directory</span>
            </a>
        </div>
    </nav>

    <main class="bingo-main">
        <div class="bingo-card-wrapper">
            <div id="bingo-card"></div>
        </div>
        <div id="bingo-message"></div>
        <div class="button-row">
            <button id="undo-button" class="btn"><i class="fa-solid fa-rotate-left"></i> Undo</button>
            <button id="reset-button" class="btn"><i class="fa-solid fa-shuffle"></i> New Card</button>
        </div>
    </main>

    <div data-site-footer></div>

    <script src="js/bingo.js"></script>
    <script src="js/analytics.js" defer></script>
    <script type="module">
        import { renderSiteChrome } from './js/chrome.js';
        renderSiteChrome({ title: 'Karaoke Bingo', tagline: 'Mark off what you see at karaoke night!', compact: true, icon: 'fa-solid fa-dice' });
    </script>
</body>
</html>
