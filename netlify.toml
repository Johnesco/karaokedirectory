# Netlify deploy configuration.
#
# ADR-010 makes "static output served by Netlify" the project's only
# architectural constraint, so the deploy belongs in the repo rather than only
# in the Netlify dashboard.
#
# The build generates entity pages from js/data.json (ADR-012) and publishes the
# repo root. Everything the site serves is either committed or generated here —
# nothing is configured only in the Netlify dashboard.
#
# The generator is plain Node (fs + path, no dependencies). Images are referenced
# by URL, never processed at build time, so the build needs no image tooling.

[build]
  publish = "."
  # Generates /kj/, /company/ and /venue/ entity pages plus sitemap.xml from
  # js/data.json (ADR-012). Output is gitignored — the repo stays the source,
  # and the generated pages exist only in the deploy.
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# js/data.json changes whenever the curator publishes. Keep it revalidating so
# an edit is visible immediately rather than after a cache TTL.
[[headers]]
  for = "/js/data.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The Supabase proof-of-concept page was deleted by ADR-009. It was publicly
# reachable for months; this makes sure any cached link stops resolving.
[[redirects]]
  from = "/supabase/*"
  to = "/"
  status = 301
  force = true
