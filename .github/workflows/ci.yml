name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate data and CSS load order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate venue data (js/data.json)
        run: node scripts/validate-data.js

      - name: Check CSS load order across HTML pages
        run: node scripts/check-css-load-order.js

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Chromium only — playwright.config.js defines a single chromium project,
      # and the suite starts its own `serve` via the config's webServer block.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
