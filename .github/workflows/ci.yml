name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The full suite against whatever data is live, every night (#395). Several
  # specs read real data and today's date, so they can start failing with no
  # code change. This finds that within a day without blocking a publish.
  # 10:17 UTC is the small hours in Austin. A failed run emails the owner.
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

jobs:
  validate:
    name: Validate data and CSS load order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # One writer (ADR-018, #336): only the curator changes the venue data,
      # through its publish PRs on data/<date> branches. A code PR that touches
      # js/data.json fails here — make the new data valid in the code PR, then
      # make the change in the curator and publish it. The checkout is the PR's
      # merge commit, so a diff against the base is exactly the PR's changes.
      - name: One writer for js/data.json
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qx 'js/data.json'; then
            case "$HEAD_REF" in
              data/*) echo "js/data.json changed on $HEAD_REF: a curator publish, allowed." ;;
              *) echo "::error file=js/data.json::Only the curator changes js/data.json (one writer, ADR-018). Make the new data valid in this PR, then make the change in the curator and publish it."
                 exit 1 ;;
            esac
          else
            echo "js/data.json untouched."
          fi

      - name: Validate venue data (js/data.json)
        run: node scripts/validate-data.js

      - name: Check CSS load order across HTML pages
        run: node scripts/check-css-load-order.js

      # Contrast for the seven day-header gradients. They are literal
      # colours rather than tokens, and Tuesday sat at 1.45:1 under white
      # text until #165 — nothing in the repo could have caught it.
      - name: Check colour contrast
        run: node scripts/check-contrast.js

      # Pure-module unit tests via the built-in Node runner. Sub-second, no
      # browser, so they live in the fast job rather than alongside Playwright.
      #
      # `node --test` takes no path on purpose: it discovers test/*.test.mjs by
      # Node's own naming convention. A glob argument needs Node 21+, and a bare
      # directory argument stopped working in Node 24 — the no-arg form is the
      # only one that behaves the same on every version we might run on.
      - name: Unit tests
        run: npm run test:unit

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A data publish is not a code change (#395). When the PR's only changed
      # file is js/data.json, this job runs the smoke subset: enough to prove
      # the site renders the new data, not the whole behaviour suite, which
      # tests code that did not change and blocked a valid publish in #392.
      # The job itself always runs and reports, because branch protection
      # requires "End-to-end tests" by name: a job skipped by a path filter
      # would leave the PR waiting forever. Pushes to main, the nightly run
      # and every other PR get the full suite.
      - name: Is this a data-only change?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          data_only=false
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
            echo "Changed files:"; echo "$changed"
            if [ "$changed" = "js/data.json" ]; then data_only=true; fi
          fi
          echo "data_only=$data_only" >> "$GITHUB_OUTPUT"
          echo "data_only=$data_only"

      # Chromium only — playwright.config.js defines a single chromium project,
      # and the suite starts its own `serve` via the config's webServer block.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The generated entity pages are built from the data too (ADR-012), and
      # Netlify runs this on deploy: a publish that breaks it should fail here.
      - name: Build generated pages (data-only change)
        if: steps.scope.outputs.data_only == 'true'
        run: npm run build

      - name: Run the data smoke test (data-only change)
        if: steps.scope.outputs.data_only == 'true'
        run: npm run test:smoke

      - name: Run end-to-end tests
        if: steps.scope.outputs.data_only != 'true'
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
